name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
        moodle-branch: ['MOODLE_403_STABLE', 'MOODLE_404_STABLE']

    steps:
      - name: Check out plugin code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, gd, intl, xml, soap, xmlrpc, zip
          ini-values: max_execution_time=600, memory_limit=512M

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH

      - name: Setup Moodle
        run: |
          moodle-plugin-ci install --plugin plugin --moodle-branch ${{ matrix.moodle-branch }}

      - name: CodeChecker (Coding Style & Deprecated APIs)
        run: moodle-plugin-ci codechecker plugin

      - name: PHPStan
        run: moodle-plugin-ci phpstan plugin

      - name: Validate plugin files
        run: moodle-plugin-ci validate plugin

